<!doctype html><html><head><meta charset="utf-8"><title>CHIPGUARD</title>
<style>body{font-family:Arial;max-width:720px;margin:40px auto;padding:0 16px}
.card{border:1px solid #ddd;border-radius:8px;padding:24px}button{background:#1f6feb;color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer}
.err{color:#b00020}</style></head><body>
<h1>CHIPGUARD</h1><p>Personal loan acceptance prediction for targeted marketing campaigns.</p>
<div class="card"><form action="/predict" method="post" enctype="multipart/form-data">
<p><label>Customer CSV (Universal Bank format): <input type="file" name="file" accept=".csv" required></label></p>
<p><label>Model: <select name="model">
<option value="ridge" {% if best=='ridge' %}selected{% endif %}>Ridge (L2)</option>
<option value="lasso" {% if best=='lasso' %}selected{% endif %}>Lasso (L1)</option></select></label></p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<button type="submit">Run batch prediction</button></form></div></body></html>
