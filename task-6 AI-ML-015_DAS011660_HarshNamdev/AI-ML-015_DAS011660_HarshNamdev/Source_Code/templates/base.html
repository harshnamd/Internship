<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoanDefend</title><style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f3f6fa;margin:0;color:#1d2733}
nav{background:#283593;padding:14px 28px}nav a{color:#fff;margin-right:22px;text-decoration:none;font-weight:600}
.wrap{max-width:960px;margin:28px auto;padding:0 18px}
.card{background:#fff;border-radius:10px;padding:24px;box-shadow:0 2px 8px #0001;margin-bottom:20px}
label{display:block;margin:8px 0 3px;font-weight:600;font-size:.88em}
input,select{width:100%;padding:8px;border:1px solid #c5ced8;border-radius:6px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
button,.btn{background:#283593;color:#fff;border:0;padding:10px 20px;border-radius:6px;margin:14px 8px 0 0;cursor:pointer;text-decoration:none;display:inline-block}
.btn2{background:#546e7a}
.ok{background:#e8f5e9;border-left:6px solid #2e7d32;padding:14px;font-size:1.2em;margin-top:16px}
.no{background:#fdecea;border-left:6px solid #c62828;padding:14px;font-size:1.2em;margin-top:16px}
.err{background:#fff3e0;border-left:5px solid #ef6c00;padding:12px;margin-top:16px}
.tbl{border-collapse:collapse;width:100%;font-size:.88em}.tbl th,.tbl td{border-bottom:1px solid #e1e6ec;padding:6px 8px;text-align:right}
.tbl th{background:#eef3f8}.scroll{overflow-x:auto}img{max-width:100%}
</style></head><body>
<nav><a href="/">Single Application</a><a href="/batch">Batch Screening</a><a href="/report/html">Report</a><a href="/report/txt">Download TXT</a></nav>
<div class="wrap">{% block content %}{% endblock %}</div></body></html>
