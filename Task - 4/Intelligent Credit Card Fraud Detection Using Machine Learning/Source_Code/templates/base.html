<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit Card Fraud Detection</title><style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f3f6fa;margin:0;color:#1d2733}
nav{background:#7b1e1e;padding:14px 28px}nav a{color:#fff;margin-right:22px;text-decoration:none;font-weight:600}
.wrap{max-width:1000px;margin:28px auto;padding:0 18px}
.card{background:#fff;border-radius:10px;padding:24px;box-shadow:0 2px 8px #0001;margin-bottom:20px}
label{display:block;margin:8px 0 3px;font-weight:600;font-size:.85em}
input,select{width:100%;padding:7px;border:1px solid #c5ced8;border-radius:6px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
button,.btn{background:#7b1e1e;color:#fff;border:0;padding:10px 20px;border-radius:6px;margin:14px 8px 0 0;cursor:pointer;text-decoration:none;display:inline-block}
.btn2{background:#546e7a}
.fraud{background:#fdecea;border-left:6px solid #c62828;padding:14px;font-size:1.25em;margin-top:16px}
.legit{background:#e8f5e9;border-left:6px solid #2e7d32;padding:14px;font-size:1.25em;margin-top:16px}
.err{background:#fff3e0;border-left:5px solid #ef6c00;padding:12px;margin-top:16px}
.tbl{border-collapse:collapse;width:100%;font-size:.9em}.tbl th,.tbl td{border-bottom:1px solid #e1e6ec;padding:6px 8px;text-align:right}
.tbl th{background:#eef3f8}.scroll{overflow-x:auto}img{max-width:100%}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1d5f91;outline-offset:2px}
.site-footer{max-width:1000px;margin:0 auto 24px;padding:0 18px;font-size:.9em}
.site-footer a{color:#7b1e1e;margin-right:14px}
.cookie-notice{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #7b1e1e;box-shadow:0 -2px 10px #0002;padding:14px 24px;display:flex;align-items:center;justify-content:center;gap:18px}
.cookie-notice[hidden]{display:none}.cookie-notice p{margin:0;max-width:900px}
.policy-card h2{margin-top:0}.policy-card section{margin-top:24px}
@media(max-width:640px){nav{padding:12px 16px}nav a{display:inline-block;margin:4px 12px 4px 0}.cookie-notice{padding:12px 16px;align-items:flex-start;flex-direction:column;gap:4px}}
</style></head><body>
<nav aria-label="Main navigation"><a href="/">Single Prediction</a><a href="/batch">Batch Prediction</a><a href="/report/html">Report</a><a href="/report/txt">Download TXT</a></nav>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="site-footer"><strong>Policies:</strong>
<a href="/privacy-policy">Privacy</a><a href="/terms-of-service">Terms</a><a href="/refund-policy">Refunds</a><a href="/cookies-policy">Cookies</a>
<button type="button" class="btn2" id="show-cookie-notice">Cookie notice</button></footer>
<aside class="cookie-notice" id="cookie-notice" aria-label="Cookie notice">
<p><strong>Cookie notice:</strong> This app does not currently use analytics or advertising cookies. Hosting providers may use their own technologies. <a href="/cookies-policy">Read the Cookies Policy</a>.</p>
<button type="button" class="btn2" id="dismiss-cookie-notice">Dismiss</button>
</aside>
<script>
const cookieNotice=document.getElementById("cookie-notice");
document.getElementById("dismiss-cookie-notice").addEventListener("click",()=>{cookieNotice.hidden=true;});
document.getElementById("show-cookie-notice").addEventListener("click",()=>{cookieNotice.hidden=false;});
</script>
</body></html>
